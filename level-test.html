<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Placement | Village & Co.</title>

    <link rel="stylesheet" href="level-test.css">

</head>


<body>

    <!-- Navigation -->
    <header class="test-navbar">

        <a href="index.html" class="test-brand">

            <img
                src="images/mini-logo.png"
                alt="Village & Co."
                class="test-logo"
            >

        </a>

        <a href="index.html" class="back-home">
            <span>←</span>
            Voltar para o início
        </a>

    </header>


    <!-- Placement -->
    <main class="test-page">

        <section class="test-intro">

            <p class="test-label">
                ENGLISH PLACEMENT
            </p>

            <h1>
                Vamos encontrar o<br>
                melhor ponto de partida.
            </h1>

            <p class="test-description">
                Uma conversa individual em inglês para conhecermos
                o nível atual do aluno e encontrarmos a turma mais
                adequada para o seu momento.
            </p>


            <form class="student-info" id="placement-form">

                <!-- Student name -->
                <div class="form-group">

                    <label for="student-name">
                        Nome do aluno
                    </label>

                    <input
                        type="text"
                        id="student-name"
                        name="student-name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Age -->
                <div class="form-group">

                    <label for="student-age">
                        Idade
                    </label>

                    <input
                        type="text"
                        id="student-age"
                        name="student-age"
                        inputmode="numeric"
                        maxlength="2"
                        required
                    >

                </div>


                <!-- Parent phone -->
                <div class="form-group">

                    <label for="parent-phone">
                        Telefone do responsável
                    </label>

                    <input
                        type="tel"
                        id="parent-phone"
                        name="parent-phone"
                        inputmode="tel"
                        autocomplete="tel"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>


                <!-- Scheduling -->
                <div class="placement-schedule">

    <p class="schedule-label">
        ESCOLHA UMA DATA
    </p>

    <div class="available-dates" id="available-dates">
        <!-- Os sábados serão adicionados pelo JavaScript -->
    </div>


    <div class="time-section hidden" id="time-section">

        <p class="schedule-label">
            HORÁRIOS DISPONÍVEIS
        </p>

        <div class="available-times">

            <button type="button" class="time-option" data-time="09:00">
                09:00
            </button>

            <button type="button" class="time-option" data-time="09:30">
                09:30
            </button>

            <button type="button" class="time-option" data-time="10:00">
                10:00
            </button>

            <button type="button" class="time-option" data-time="10:30">
                10:30
            </button>

        </div>

    </div>

    <input type="hidden" id="placement-date" name="placement-date">
    <input type="hidden" id="placement-time" name="placement-time">

</div>

                <button type="submit" class="start-test">
                    Agendar placement
                    <span>→</span>
                </button>

            </form>

        </section>

    </main>
    <script src="placement.js"></script>

</body>

</html>
