<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Level Test | Village & Co.</title>

    <link rel="stylesheet" href="level-test.css">

</head>


<body>

    <!-- Navigation -->
    <header class="test-navbar">

        <a href="index.html" class="test-brand">

            <img
                src="images/mini-logo.png"
                alt="Village & Co."
                class="test-logo"
            >

        </a>

        <a href="index.html" class="back-home">
            Voltar para o início
            <span>←</span>
        </a>

    </header>


    <!-- Level Test -->
    <main class="test-page">

        <section class="test-intro">

            <p class="test-label">
                LEVEL TEST
            </p>

            <h1>
                Vamos descobrir<br>
                por onde começar.
            </h1>

            <p class="test-description">
                Este teste nos ajuda a conhecer um pouco do contato
                atual do aluno com o inglês e encontrar uma turma
                adequada.
            </p>


            <form class="student-info">

                <div class="form-group">

                    <label for="student-name">
                        Nome do aluno
                    </label>

                    <input
                        type="text"
                        id="student-name"
                        name="student-name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="student-age">
                        Idade
                    </label>

                    <input
                        type="text"
                        id="student-age"
                        name="student-age"
                        inputmode="numeric"
                        maxlength="2"
                        required
                    >

                </div>


                <button type="submit" class="start-test">
                    Começar
                    <span>→</span>
                </button>

            </form>

        </section>

    </main>

</body>

</html>
